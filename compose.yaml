services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_LOG_PATH: /app/logs/model_calls.jsonl
      ENRICHMENT_CACHE_DIR: /app/.cache/enrichment
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.cache:/app/.cache
      - model_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: nginx:1.30-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:25796:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  model_logs:
